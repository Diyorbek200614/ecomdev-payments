<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт оплат</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
          --accent: #2563eb; --danger: #dc2626; --ok: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 17px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, button { font: inherit; width: 100%; min-height: 44px; border-radius: 8px; }
  input, select { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 0 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
  button { border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 0 18px; cursor: pointer; }
  button:disabled { opacity: .6; }
  #month { width: auto; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 14px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; border-top: 0; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  td.debt { color: var(--danger); font-weight: 600; }
  tfoot td { font-weight: 600; }
  .empty { text-align: center; color: var(--ok); padding: 16px 0; }

  /* Phone: the form stacks, each debtor row becomes a small card. */
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    thead { display: none; }
    table, tbody, tfoot, tr, td { display: block; }
    tr { border-top: 1px solid var(--line); padding: 8px 0; }
    td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 14px; font-weight: 400; }
    td:first-child { font-weight: 600; }
    td:first-child::before { content: none; }
    td:empty { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Учёт оплат</h1>

  <section class="card">
    <div class="head"><h2>Добавить оплату</h2></div>
    <form id="pay-form" novalidate>
      <div class="grid">
        <div>
          <label for="student">Ученик</label>
          <select id="student"></select>
        </div>
        <div>
          <label for="amount">Сумма</label>
          <input id="amount" inputmode="decimal" autocomplete="off" placeholder="500000">
        </div>
        <button type="submit" id="pay-btn">Добавить</button>
      </div>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <h2>Должники</h2>
      <input id="month" type="month" aria-label="Месяц">
    </div>
    <table>
      <thead><tr><th>Ученик</th><th>Сумма в месяц</th><th>Оплачено</th><th>Долг</th></tr></thead>
      <tbody id="debtors"></tbody>
      <tfoot id="total"></tfoot>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (v) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(Number(v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function say(text, kind) {
  $('msg').textContent = text;
  $('msg').className = 'msg ' + (kind || '');
}

// DRF errors come as {"detail": "..."} or {"field": ["...", ...]}: turn either into one line.
function errorText(data, status) {
  if (!data) return `Ошибка сервера (${status})`;
  if (data.detail) return data.detail;
  return Object.values(data).flat().join(' ');
}

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(errorText(data, res.status));
  return data;
}

async function loadStudents() {
  const students = await api('/api/students/');
  $('student').innerHTML = '<option value="">Выберите ученика</option>' +
    students.map((s) => `<option value="${s.id}">${esc(s.name)} · ${esc(s.group)}</option>`).join('');
}

async function loadDebtors() {
  const debtors = await api('/api/debtors/?month=' + encodeURIComponent($('month').value));
  if (!debtors.length) {
    $('debtors').innerHTML = '<tr><td colspan="4" class="empty">Должников нет</td></tr>';
    $('total').innerHTML = '';
    return;
  }
  $('debtors').innerHTML = debtors.map((d) => `
    <tr>
      <td>${esc(d.name)}</td>
      <td data-label="Сумма в месяц">${money(d.monthly_fee)}</td>
      <td data-label="Оплачено">${money(d.paid)}</td>
      <td data-label="Долг" class="debt">${money(d.debt)}</td>
    </tr>`).join('');
  const total = debtors.reduce((sum, d) => sum + Number(d.debt), 0);
  $('total').innerHTML = `<tr><td>Итого: ${debtors.length} чел.</td><td></td><td></td>
    <td data-label="Общий долг" class="debt">${money(total)}</td></tr>`;
}

$('pay-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const student = $('student').value;
  const amount = $('amount').value.replace(/\s/g, '').replace(',', '.');
  if (!student) return say('Выберите ученика.', 'err');
  if (!amount) return say('Введите сумму.', 'err');
  $('pay-btn').disabled = true;
  try {
    const p = await api('/api/payments/', { method: 'POST', body: JSON.stringify({ student: Number(student), amount }) });
    const name = $('student').selectedOptions[0].textContent.split(' · ')[0];
    say(`Оплата добавлена: ${name}, ${money(p.amount)} (${p.date}).`, 'ok');
    $('amount').value = '';
    await loadDebtors();
  } catch (err) {
    say(err.message, 'err');
  } finally {
    $('pay-btn').disabled = false;
  }
});

$('month').addEventListener('change', () => loadDebtors().catch((err) => say(err.message, 'err')));

// Tashkent is UTC+5 all year, the same "current month" the server uses.
$('month').value = new Date(Date.now() + 5 * 3600e3).toISOString().slice(0, 7);
Promise.all([loadStudents(), loadDebtors()]).catch((err) => say(err.message, 'err'));
</script>
</body>
</html>
